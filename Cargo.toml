[package]
name = "winisland-lyrics-translate"
version = "0.1.0"
edition = "2024"
authors = ["BVLGARISSK"]
description = "Offline lyric translation below each line with NLLB-200 Distilled 600M"
repository = "https://github.com/BVLGARISSK/winisland-lyrics-translate"
license = "GPL-3.0-only"
publish = false

[package.metadata.winisland]
id = "winisland-lyrics-translate"
name = "Lyrics Translation"

[lib]
name = "winisland_lyrics_translate"
crate-type = ["cdylib"]

[dependencies]
winisland-plugin-api = { git = "https://github.com/BVLGARISSK/WinIsland", branch = "feat/plugin-secondary-lyrics" }
serde_json = "1.0"

[dev-dependencies]
winisland-plugin-api = { git = "https://github.com/BVLGARISSK/WinIsland", branch = "feat/plugin-secondary-lyrics", features = ["packager"] }

[[example]]
name = "pack"
path = "package.rs"

[profile.release]
panic = "abort"
strip = true

# Keep this plugin out of any parent workspace.
[workspace]
